[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trial-matcher"
version = "0.2.0"
description = "Clinical trial pre-screening from a FHIR record: a status per eligibility criterion with evidence and heuristic confidence, reviewed by a coordinator."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Maria (Anh Duong Vo)" }]
keywords = ["clinical-trials", "eligibility", "fhir", "llm", "agents", "nemotron"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "openai>=1.40",
  "langgraph>=0.3",
  "pydantic>=2.6",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
nat = ["nvidia-nat[langchain,eval,profiler,mcp]>=1.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff==0.16.10", "fhir.resources>=7.1"]

[project.scripts]
ctm = "trial_matcher.cli:app"

[project.entry-points.'nat.components']
trial_matcher = "trial_matcher.nat_plugin.register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trial_matcher = ["samples/*.jsonl", "samples/patients/*.json", "samples/trials/*.json"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
